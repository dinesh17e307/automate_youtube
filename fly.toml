# app = Docker image (API + worker + FFmpeg)
app = "kids-youtube-api"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  STORAGE_PATH = "/app/storage"
  START_SCHEDULER = "true"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "10s"

# FFmpeg video rendering needs more than 256MB — scale up if jobs fail
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
