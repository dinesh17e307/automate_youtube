# Render Blueprint — recommended deployment
# Deploy: https://dashboard.render.com → New → Blueprint → connect repo

services:
  # API + background worker in one service (shares persistent disk for videos)
  - type: web
    name: kids-youtube-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: kids-youtube-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: STORAGE_PATH
        value: /app/storage
      - key: DATABASE_URL
        fromDatabase:
          name: kids-youtube-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kids-youtube-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_DAILY_PIPELINE
        value: "0 0 * * *"
      - key: CRON_ANALYTICS
        value: "0 */6 * * *"

  # React admin dashboard (static site)
  - type: web
    name: kids-youtube-frontend
    runtime: static
    buildCommand: npm ci && npm run build -w @kids-youtube/shared && npm run build -w @kids-youtube/frontend
    staticPublishPath: apps/frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis for BullMQ job queue
  - type: keyvalue
    name: kids-youtube-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: kids-youtube-db
    plan: basic-256mb
    databaseName: kids_youtube
    user: kids_youtube
